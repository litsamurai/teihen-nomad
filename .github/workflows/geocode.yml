name: お店の位置を調べる（地図用）
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  geocode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/geocode.js
      - name: 変更があれば保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/restaurants.json
          if git diff --cached --quiet; then echo "変更なし"; else git commit -m "お店の位置（目安）を追加"; git pull --rebase origin main; git push; fi
