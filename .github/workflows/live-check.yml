name: live-check
on:
  workflow_dispatch:
    inputs:
      tabs:
        description: "確認するタブ（カンマ区切り）"
        default: "stays,food,home"
      browser:
        description: "chromium か webkit（iPhone Safari相当）"
        default: "chromium"
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright && npx playwright install --with-deps chromium webkit
      - run: node tools/live-check.js
        env:
          TABS: ${{ inputs.tabs }}
          BROWSER: ${{ inputs.browser }}
      - name: スクショを live-shots ブランチに保存
        if: always()
        run: |
          cp -r shots /tmp/shots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan live-shots
          git rm -rf . -q || true
          cp -r /tmp/shots/. .
          git add -A
          git commit -q -m "live-check $(date -u +%FT%TZ)"
          git push -f origin live-shots
