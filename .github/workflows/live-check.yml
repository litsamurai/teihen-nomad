name: live-check
on:
  workflow_dispatch:
    inputs:
      tabs:
        description: "確認するタブ（カンマ区切り）"
        default: "stays,food,home"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright && npx playwright install --with-deps chromium
      - run: node tools/live-check.js
        env:
          TABS: ${{ inputs.tabs }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: shots
          retention-days: 3
