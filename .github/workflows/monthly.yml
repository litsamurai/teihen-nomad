name: 毎月の更新（為替・国別ページ）
on:
  schedule:
    # 毎月1日 日本時間 9:00（UTC 0:00）
    - cron: "0 0 1 * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: monthly
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/update-fx.js
      - run: node tools/build-country-pages.js
      - name: 変更があれば保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data country city sitemap.xml
          if git diff --cached --quiet; then echo "変更なし"; else git commit -m "毎月の更新：為替レートと国別ページ"; git push; fi
