name: webkit-variants
on: workflow_dispatch
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright && npx playwright install --with-deps webkit
      - run: node tools/webkit-variants.js
      - name: スクショを live-shots ブランチに保存
        if: always()
        run: |
          cp -r shots /tmp/shots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan live-shots
          git rm -rf . -q || true
          cp -r /tmp/shots/. .
          git add -A
          git commit -q -m "webkit-variants $(date -u +%FT%TZ)"
          git push -f origin live-shots
