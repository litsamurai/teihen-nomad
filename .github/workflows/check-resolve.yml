        run: |
          curl -sS -m 40 -X POST "https://puciqvaespjdjbhavznt.supabase.co/functions/v1/resolve-map" -H "apikey: sb_publishable_JB5RaPplzCEtrYs60uFdWw_z9DKM2ob" -H "Content-Type: application/json" -d '{"url":"https://maps.app.goo.gl/wbh18zrmZpx8DNPL8?g_st=ic"}' | python3 -c 'import sys,json;d=json.load(sys.stdin);print("RESULT name=",d.get("name")," addr=",d.get("addr")," lat=",d.get("lat")," err=",d.get("error"))'
