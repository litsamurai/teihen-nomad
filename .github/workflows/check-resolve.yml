name: check-resolve-map
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: function and address search
        run: |
          curl -sS -m 40 -X POST "https://puciqvaespjdjbhavznt.supabase.co/functions/v1/resolve-map" -H "apikey: ${{ vars.X || 'sb_publishable_JB5RaPplzCEtrYs60uFdWw_z9DKM2ob' }}" -H "Content-Type: application/json" -d '{"url":"https://maps.app.goo.gl/wbh18zrmZpx8DNPL8?g_st=ic"}' | head -c 600; echo
          curl -sS -m 30 -A "teihen-nomad-check" -G "https://nominatim.openstreetmap.org/search" --data-urlencode "q=Hanzhong St 42 Wanhua District Taipei City" -d "format=jsonv2&limit=1&accept-language=ja" | head -c 350; echo
